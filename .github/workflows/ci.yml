
name: Deploy
on:
  push:
    branches: breaditor
  pull_request:
    branches: breaditor

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted

    permissions:
      id-token: write # Needed for auth with Deno Deploy
      contents: read # Needed to clone the repository

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      # Add these steps before any npm/yarn commands
      - name: Install SQLite3 build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make gcc g++ sqlite3 libsqlite3-dev node-gyp

      - name: Rebuild SQLite3
        if: runner.os == 'Linux'
        run: |
          npm install sqlite3 --build-from-source
          # or if using yarn:
          # yarn add sqlite3 --build-from-source

      - name: Create port files
        run: |
          echo "8025" > .port_backend
          echo "5000" > .port_frontend

      - name: Install Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: use actions--context
        uses: qoomon/actions--context@v4

      - name: Set outputs
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "github_job_id=${GITHUB_JOB_ID}" >> $GITHUB_OUTPUT

      - name: Verify shortcode
        run: |
          echo ${{ steps.vars.outputs.sha_short }}
          echo ${{ steps.vars.outputs.github_job_id }}

      - name: Build step
        run: |
          deno task build
          chmod -R g+w *
          chmod -R g+w .*

      - name: Test step
        run: "yarn test"

      - name: Fail if there are any .ts or .tsx files in the project without a .test.ts or .test.tsx file
        shell: pwsh
        run: ./scripts/check-test-files.ps1

      - name: Fail if required shiboleths for replacement are missing
        shell: pwsh
        run: |
          # fail if GIT_VERSION_REPLACED_BY_CI_DO_NOT_CHANGE or DEPLOY_TIMESTAMP_REPLACED_BY_CI_DO_NOT_CHANGE are missing from backend/constants.ts
          $content = Get-Content "backend/constants.ts" -Raw
          if (-not ($content -match "GIT_VERSION_REPLACED_BY_CI_DO_NOT_CHANGE" -and $content -match "DEPLOY_TIMESTAMP_REPLACED_BY_CI_DO_NOT_CHANGE")) {
              Write-Error "Required replacement tokens are missing from backend/constants.ts"
              exit 1
          }

      - name: Replace ci variables
        shell: pwsh
        run: |
          # replace GIT_VERSION_REPLACED_BY_CI_DO_NOT_CHANGE in backend/constants.ts with the 7-digit git sha
          $content = Get-Content "backend/constants.ts" -Raw
          $gitSha = "${{ steps.vars.outputs.sha_short }}".Substring(0,7)
          $newContent = $content -replace "GIT_VERSION_REPLACED_BY_CI_DO_NOT_CHANGE", $gitSha
          Set-Content "backend/constants.ts" $newContent

          # replace DEPLOY_TIMESTAMP_REPLACED_BY_CI_DO_NOT_CHANGE in backend/constants.ts with the ISO timestamp for now
          $timestamp = [DateTime]::UtcNow.ToString("o")
          $newContent = $newContent -replace "DEPLOY_TIMESTAMP_REPLACED_BY_CI_DO_NOT_CHANGE", $timestamp
          Set-Content "backend/constants.ts" $newContent

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          if_key_exists: "ignore"

      - name: Transfer build artifacts
        run: |
          echo "cleaning up stage"
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "rm -rf ~/spritewright || true"
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "mkdir ~/spritewright || true"

          echo "uploading to stage"
          scp -r dist/* ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/spritewright/front
          rsync -av ./* ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/spritewright/back

          echo "stopping service"
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "sudo systemctl stop spritewright.service"

          echo "waiting for service to stop (timeout 1 minute)"
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            timeout=60
            elapsed=0
            while systemctl is-active --quiet spritewright.service; do
              if [ $elapsed -ge $timeout ]; then
                echo "Service failed to stop within 1 minute timeout" >&2
                exit 1
              fi
              sleep 1
              ((elapsed++))
            done
          "

      - name: Restarting service
        run: |
          echo "Restarting service"
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "sudo /home/deno-user/flip_spritewrite.com.sh"

      - name: Verify deployment
        shell: pwsh
        run: |
          Write-Host "Waiting for deployment to be live with SHA: ${{ steps.vars.outputs.sha_short }}"
          $timeout = 60
          $elapsed = 0

          while ($elapsed -lt $timeout) {
            try {
              $response = Invoke-RestMethod -Uri "https://spritewright.com/api/version" -Method Get
              if ($response.SHA -eq "${{ steps.vars.outputs.sha_short }}") {
                Write-Host "Deployment verified! New version is live."
                exit 0
              }
            } catch {
              # Ignore errors and continue polling
            }

            Write-Host "Waiting for deployment to be live (${elapsed}s/${timeout}s)..."
            Start-Sleep -Seconds 2
            $elapsed += 2
          }

          Write-Error "Timeout waiting for deployment to be verified"
          exit 1

      - name: Send Discord Notification
        if: always()
        shell: bash
        run: |
          STATUS_COLOR=$([ "${{ job.status }}" == "success" ] && echo "3066993" || echo "15158332")
          STATUS_EMOJI=$([ "${{ job.status }}" == "success" ] && echo "✅" || echo "❌")
          STATUS_TEXT=$([ "${{ job.status }}" == "success" ] && echo "Deploy Successful - https://spritewright.com/" || echo "Deploy Failed")
          STATUS_LINK_TITLE=$([ "${{ job.status }}" == "success" ] && echo "Github Link" || echo "Failed Action")
          STATUS_LINK_HREF=$([ "${{ job.status }}" == "success" ] && echo "${{ github.event.head_commit.url }}" || echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ steps.vars.outputs.github_job_id }}")

          curl -X POST -H "Content-Type: application/json" \
          -d "{
            \"username\": \"Staging Bot\",
            \"avatar_url\": \"https://verge-rpg.com/assets/uploads/bottom-main/verge-48.png\",
            \"content\": \"$STATUS_EMOJI $STATUS_TEXT\",
            \"embeds\": [{
              \"color\": $STATUS_COLOR,
              \"fields\": [
                {
                  \"name\": \"Commit msg\",
                  \"value\": \"${{ github.event.head_commit.message }}\",
                  \"inline\": true
                },
                {
                  \"name\": \"$STATUS_LINK_TITLE\",
                  \"value\": \"$STATUS_LINK_HREF\",
                  \"inline\": true
                }
              ]
            }]
          }" \
          ${{ secrets.DISCORD_WEBHOOK }}
